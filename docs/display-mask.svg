<svg xmlns="http://www.w3.org/2000/svg" width="410" height="502" viewBox="0 0 410 502">
  <!-- Estimated usable AMOLED area for T-Watch Ultra V1.0.
       Coordinates are logical display pixels; corner radius is 90 px. -->
  <mask id="usable-area">
    <rect width="410" height="502" fill="black"/>
    <rect x="0" y="0" width="410" height="502" rx="90" ry="90" fill="white"/>
  </mask>
  <rect width="410" height="502" fill="white" mask="url(#usable-area)"/>
</svg>
