name: Verify firmware and simulator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          apt-get update
          apt-get install --yes cmake cppcheck libsdl2-dev pkg-config
      - name: Fetch pinned public BHI260AP firmware
        run: |
          mkdir -p assets/bhi260
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/BoschSensortec/BHI2xy_SensorAPI/master/firmware/bhi260ap/BHI260AP.fw \
            --output assets/bhi260/BHI260AP.fw
          echo "318def511fd8eb762bf1e61cf02cfd6ecac70f8627d3bacfa7d24a1641f9e915  assets/bhi260/BHI260AP.fw" | sha256sum --check

      - name: Build firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py build
      - name: Test AXP2101 pure logic
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -I components/drivers/axp2101 \
            components/drivers/axp2101/test/test_axp2101_logic.c \
            components/drivers/axp2101/axp2101_logic.c \
            -o /tmp/test_axp2101_logic
          /tmp/test_axp2101_logic

      - name: Test I2C frame logic
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -I components/drivers/i2c_bus/include \
            components/drivers/i2c_bus/test/test_i2c_bus_frame.c \
            components/drivers/i2c_bus/i2c_bus_frame.c \
            -o /tmp/test_i2c_bus_frame
          /tmp/test_i2c_bus_frame

      - name: Test XL9555 pin mapping
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -I components/drivers/xl9555 \
            components/drivers/xl9555/test/test_xl9555_logic.c \
            components/drivers/xl9555/xl9555_logic.c \
            -o /tmp/test_xl9555_logic
          /tmp/test_xl9555_logic

      - name: Test PCF85063A calendar logic
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -I components/drivers/pcf85063a/include \
            components/drivers/pcf85063a/test/test_pcf85063a_time.c \
            components/drivers/pcf85063a/pcf85063a_time.c \
            -o /tmp/test_pcf85063a_time
          /tmp/test_pcf85063a_time

      - name: Test CST9217 geometry logic
        run: |
          gcc -Wall -Wextra -Werror -std=c11 \
            -I components/drivers/cst9217 \
            components/drivers/cst9217/test/test_cst9217_logic.c \
            components/drivers/cst9217/cst9217_logic.c \
            -o /tmp/test_cst9217_logic
          /tmp/test_cst9217_logic

      - name: Run static analysis
        run: bash tools/run_cppcheck.sh
      - name: Build simulator and capture the watch face
        run: |
          cmake -S sim -B sim/build
          cmake --build sim/build --parallel 2
          SDL_VIDEODRIVER=offscreen UWATCH_SIM_SCREEN=watch \
            UWATCH_SIM_SHOT=/tmp/uwatch-sim-watch.ppm sim/build/uwatch_sim
          test -s /tmp/uwatch-sim-watch.ppm
